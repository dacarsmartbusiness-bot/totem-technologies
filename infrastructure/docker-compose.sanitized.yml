services:
  totem-postgis:
    image: postgis/postgis:16-3.5
    container_name: totem-postgis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: "[REDACTED]"
      TZ: America/Lima
      PGTZ: America/Lima
    volumes:
      - totem_postgis_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - totem-internal
      - n8n-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  totem_postgis_data:
    name: totem_postgis_data

networks:
  totem-internal:
    name: totem-internal
    internal: true
  n8n-shared:
    external: true
    name: n8n-server_default
